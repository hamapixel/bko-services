name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bko_ci
          POSTGRES_USER: bko_ci
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bko_ci -d bko_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-2026-long-enough
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: bko_ci
      DB_USER: bko_ci
      DB_PASSWORD: ci_postgres_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      PAYMENT_PROVIDER: GENERIC
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Django configuration and migrations
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - name: Test on PostgreSQL
        run: >-
          python backend/manage.py test
          apps.accounts apps.locations apps.catalog apps.providers
          apps.requests apps.reviews apps.notifications apps.messaging
          apps.complaints apps.subscriptions apps.payments

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BKO_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    name: Docker production stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: >-
          docker compose --env-file .env.docker.example
          -f compose.prod.yml -f compose.local.yml config
      - name: Build and start BKO stack
        run: >-
          docker compose --env-file .env.docker.example
          -f compose.prod.yml -f compose.local.yml up -d --build
      - name: Wait for healthy containers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            backend_id="$(docker compose --env-file .env.docker.example -f compose.prod.yml -f compose.local.yml ps -q backend)"
            frontend_id="$(docker compose --env-file .env.docker.example -f compose.prod.yml -f compose.local.yml ps -q frontend)"
            backend_status="$(docker inspect --format='{{.State.Health.Status}}' "$backend_id" 2>/dev/null || true)"
            frontend_status="$(docker inspect --format='{{.State.Health.Status}}' "$frontend_id" 2>/dev/null || true)"
            echo "attempt=$attempt backend=$backend_status frontend=$frontend_status"
            if [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env.docker.example -f compose.prod.yml -f compose.local.yml ps
          docker compose --env-file .env.docker.example -f compose.prod.yml -f compose.local.yml logs --no-color backend frontend db
          exit 1
      - name: Smoke test HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8001/health/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3001/
      - name: Stop isolated BKO stack
        if: always()
        run: >-
          docker compose --env-file .env.docker.example
          -f compose.prod.yml -f compose.local.yml down -v --remove-orphans
